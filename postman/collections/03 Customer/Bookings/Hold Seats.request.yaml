$kind: http-request
name: Hold Seats
description: |-
  Purpose: Temporarily hold two available seats for the demo show.
  Authentication required: Customer bearer token.
  Notes: Run Get Show Seats first to populate seat_id_1 and seat_id_2.
url: "{{base_url}}/api/customer/bookings/hold"
method: POST
headers:
  Authorization: Bearer {{customer_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "showId": {{show_id}},
      "seatIds": [{{seat_id_1}}, {{seat_id_2}}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code success", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      const response = pm.response.json();

      pm.test("Response has success field", function () {
          pm.expect(response).to.have.property("success");
      });

      pm.test("Response has message field", function () {
          pm.expect(response).to.have.property("message");
      });

      pm.test("Response has data field", function () {
          pm.expect(response).to.have.property("data");
      });
    language: text/javascript
order: 4100
