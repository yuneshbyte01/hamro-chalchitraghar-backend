$kind: http-request
name: Update Movie
description: |-
  Purpose: Update the demo Jatra movie description.
  Authentication required: Admin bearer token.
  Notes: Requires movie_id from Create Movie.
url: "{{base_url}}/api/admin/movies/{{movie_id}}"
method: PUT
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Jatra",
      "genre": "Comedy",
      "durationMinutes": 125,
      "language": "Nepali",
      "description": "Updated Nepali comedy movie description.",
      "posterUrl": "https://example.com/posters/jatra.jpg",
      "releaseDate": "2026-08-15",
      "status": "NOW_SHOWING"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code success", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      const response = pm.response.json();

      pm.test("Response has success field", function () {
          pm.expect(response).to.have.property("success");
      });

      pm.test("Response has message field", function () {
          pm.expect(response).to.have.property("message");
      });

      pm.test("Response has data field", function () {
          pm.expect(response).to.have.property("data");
      });
    language: text/javascript
order: 6030
