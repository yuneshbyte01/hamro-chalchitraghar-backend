$kind: http-request
name: Create Movie
description: |-
  Purpose: Create the demo Jatra movie.
  Authentication required: Admin bearer token.
  Notes: Saves response.data.id into movie_id.
url: "{{base_url}}/api/admin/movies"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Jatra",
      "genre": "Comedy",
      "durationMinutes": 125,
      "language": "Nepali",
      "description": "A Nepali comedy movie about unexpected events and friendship.",
      "posterUrl": "https://example.com/posters/jatra.jpg",
      "releaseDate": "2026-08-15",
      "status": "NOW_SHOWING"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code success", function () {
          pm.response.to.have.status(201);
      });

      const response = pm.response.json();

      pm.test("Response has success field", function () {
          pm.expect(response).to.have.property("success");
      });

      pm.test("Response has message field", function () {
          pm.expect(response).to.have.property("message");
      });

      pm.test("Response has data field", function () {
          pm.expect(response).to.have.property("data");
      });

      pm.test("Movie response has id", function () {
          pm.expect(response.data).to.have.property("id");
      });

      if (response.success && response.data && response.data.id) {
          pm.environment.set("movie_id", response.data.id);
      }
    language: text/javascript
order: 6020
