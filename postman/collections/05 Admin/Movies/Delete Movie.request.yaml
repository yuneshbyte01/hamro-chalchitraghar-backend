$kind: http-request
name: Delete Movie
description: |-
  Purpose: Delete the demo movie.
  Authentication required: Admin bearer token.
  Notes: Run this after dependent show and booking checks are complete.
url: "{{base_url}}/api/admin/movies/{{movie_id}}"
method: DELETE
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code success", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
    language: text/javascript
order: 6040
