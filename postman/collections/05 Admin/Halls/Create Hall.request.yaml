$kind: http-request
name: Create Hall
description: |-
  Purpose: Create the demo AUD1 hall.
  Authentication required: Admin bearer token.
  Notes: Saves response.data.id into hall_id.
url: "{{base_url}}/api/admin/halls"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "AUD1",
      "capacity": 188,
      "layoutRef": "STANDARD",
      "status": "ACTIVE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code success", function () {
          pm.response.to.have.status(201);
      });

      const response = pm.response.json();

      pm.test("Response has success field", function () {
          pm.expect(response).to.have.property("success");
      });

      pm.test("Response has message field", function () {
          pm.expect(response).to.have.property("message");
      });

      pm.test("Response has data field", function () {
          pm.expect(response).to.have.property("data");
      });

      pm.test("Hall response has id", function () {
          pm.expect(response.data).to.have.property("id");
      });

      if (response.success && response.data && response.data.id) {
          pm.environment.set("hall_id", response.data.id);
      }
    language: text/javascript
order: 6130
