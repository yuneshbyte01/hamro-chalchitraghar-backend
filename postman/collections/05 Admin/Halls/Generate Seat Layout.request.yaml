$kind: http-request
name: Generate Seat Layout
description: |-
  Purpose: Generate seats for the demo hall.
  Authentication required: Admin bearer token.
  Notes: Run after Create Hall and before Create Show/Get Show Seats.
url: "{{base_url}}/api/admin/halls/{{hall_id}}/seat-layout"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code success", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      const response = pm.response.json();

      pm.test("Response has success field", function () {
          pm.expect(response).to.have.property("success");
      });

      pm.test("Response has message field", function () {
          pm.expect(response).to.have.property("message");
      });
    language: text/javascript
order: 6160
