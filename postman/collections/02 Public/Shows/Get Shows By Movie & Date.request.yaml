$kind: http-request
name: Get Shows By Movie & Date
description: |-
  Purpose: List public shows for the demo movie on 2026-08-20.
  Authentication required: No.
  Notes: Requires movie_id and uses the shared demo show date.
url: "{{base_url}}/api/public/shows?movieId={{movie_id}}&date=2026-08-20"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code success", function () {
          pm.response.to.have.status(200);
      });

      const response = pm.response.json();

      pm.test("Response has success field", function () {
          pm.expect(response).to.have.property("success");
      });

      pm.test("Response has message field", function () {
          pm.expect(response).to.have.property("message");
      });

      pm.test("Response has data field", function () {
          pm.expect(response).to.have.property("data");
      });
    language: text/javascript
order: 3230
