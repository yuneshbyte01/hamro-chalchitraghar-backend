$kind: http-request
name: Get Show Seats
description: |-
  Purpose: List seats for a show and capture the first two available seats.
  Authentication required: No.
  Notes: Saves AVAILABLE seat IDs into seat_id_1 and seat_id_2 for booking requests.
url: "{{base_url}}/api/public/shows/{{show_id}}/seats"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code success", function () {
          pm.response.to.have.status(200);
      });

      const response = pm.response.json();

      pm.test("Response has success field", function () {
          pm.expect(response).to.have.property("success");
      });

      pm.test("Response has message field", function () {
          pm.expect(response).to.have.property("message");
      });

      pm.test("Response has data field", function () {
          pm.expect(response).to.have.property("data");
          pm.expect(response.data).to.be.an("array");
      });

      const availableSeats = (response.data || []).filter(function (seat) {
          return seat.status === "AVAILABLE";
      });

      pm.test("At least two available seats exist", function () {
          pm.expect(availableSeats.length).to.be.at.least(2);
      });

      if (availableSeats.length >= 2) {
          pm.environment.set("seat_id_1", availableSeats[0].id);
          pm.environment.set("seat_id_2", availableSeats[1].id);
      }
    language: text/javascript
order: 3300
