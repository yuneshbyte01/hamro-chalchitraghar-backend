spring:
  datasource:
    url: jdbc:h2:mem:hamro_chalachitraghar_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-jwt-signing-that-is-long-enough
  expiration-ms: 3600000

cors:
  allowed-origins: http://localhost:4200

app:
  time-zone: Asia/Kathmandu
  notifications:
    reminders:
      enabled: false
      show-before: PT2H
      scan-interval: PT5M
      batch-size: 100
    retention:
      enabled: false
      notification-days: 365
      delivery-days: 180
      batch-size: 100
      interval: PT24H
    email:
      enabled: false
      from: notifications@test.local
      max-attempts: 3
      initial-retry-delay-ms: 1000
      retry-multiplier: 2.0
      max-retry-delay-ms: 10000
      retry-batch-size: 50
      retry-interval-ms: 60000
      processing-timeout-ms: 30000
      async:
        enabled: false
      executor:
        core-pool-size: 1
        max-pool-size: 1
        queue-capacity: 10
        keep-alive-seconds: 10
  bookings:
    initiated-expiration-minutes: 15
    currency: NPR
    expiry-cleanup-interval-ms: 60000
    expiry-batch-size: 100
    cancellation-cutoff-minutes: 0
  payments:
    attempt-expiration-minutes: 10
    local-enabled: true
    esewa:
      enabled: true
      environment: SANDBOX
      product-code: EPAYTEST
      secret-key: 8gBm/:&EnhH.1/q
      payment-url: https://rc-epay.esewa.com.np/api/epay/main/v2/form
      status-check-url: http://localhost:1/api/epay/transaction/status/
      success-url: http://localhost:4200/payment/esewa/success
      failure-url: http://localhost:4200/payment/esewa/failure
      connect-timeout-ms: 100
      read-timeout-ms: 100
  shows:
    status-reconciliation-interval-ms: 60000
  tickets:
    qr:
      encryption-key: MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=
      key-id: qr-test-v1
      token-version: 1
      image-size: 400
      image-margin: 2
    entry-window-minutes: 60
    post-show-grace-minutes: 30
    expiry-reconciliation-interval-ms: 60000
    expiry-batch-size: 100
    pdf-enabled: true
    email:
      enabled: false
      from: tickets@test.local
      max-attempts: 3
      retry-interval-ms: 60000
      retry-batch-size: 50
  mail:
    from: no-reply@hamrochalachitraghar.com
    enabled: false
  password-reset:
    otp-expiration-minutes: 10
    max-attempts: 5

google:
  client-id: test-google-client-id
  client-secret: test-google-client-secret
