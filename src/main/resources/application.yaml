spring:
  application:
    name: hamro-chalchitraghar-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 8

app:
  time-zone: ${APP_TIME_ZONE:Asia/Kathmandu}
  bookings:
    initiated-expiration-minutes: ${BOOKING_INITIATED_EXPIRATION_MINUTES:15}
    currency: ${BOOKING_CURRENCY:NPR}
    expiry-cleanup-interval-ms: ${BOOKING_EXPIRY_CLEANUP_INTERVAL_MS:60000}
    expiry-batch-size: ${BOOKING_EXPIRY_BATCH_SIZE:100}
    cancellation-cutoff-minutes: ${BOOKING_CANCELLATION_CUTOFF_MINUTES:0}
  payments:
    attempt-expiration-minutes: ${PAYMENT_ATTEMPT_EXPIRATION_MINUTES:10}
    local-enabled: ${PAYMENT_LOCAL_ENABLED:false}
    esewa:
      enabled: ${ESEWA_ENABLED:false}
      environment: ${ESEWA_ENVIRONMENT:SANDBOX}
      product-code: ${ESEWA_PRODUCT_CODE:EPAYTEST}
      secret-key: ${ESEWA_SECRET_KEY:disabled-placeholder}
      payment-url: ${ESEWA_PAYMENT_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
      status-check-url: ${ESEWA_STATUS_CHECK_URL:https://rc.esewa.com.np/api/epay/transaction/status/}
      success-url: ${ESEWA_SUCCESS_URL:http://localhost:4200/payment/esewa/success}
      failure-url: ${ESEWA_FAILURE_URL:http://localhost:4200/payment/esewa/failure}
      connect-timeout-ms: ${ESEWA_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${ESEWA_READ_TIMEOUT_MS:10000}
  shows:
    buffer-minutes: ${SHOW_BUFFER_MINUTES:15}
    duration-tolerance-minutes: ${SHOW_DURATION_TOLERANCE_MINUTES:5}
    status-reconciliation-interval-ms: ${SHOW_STATUS_RECONCILIATION_INTERVAL_MS:60000}
