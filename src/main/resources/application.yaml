spring:
  application:
    name: hamro-chalchitraghar-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 8

  lifecycle:
    timeout-per-shutdown-phase: ${GRACEFUL_SHUTDOWN_TIMEOUT:30s}

server:
  shutdown: graceful

management:
  metrics:
    tags:
      application: hamro-chalchitraghar
      environment: ${APP_ENVIRONMENT:local}
  prometheus:
    security:
      username: ${PROMETHEUS_SCRAPE_USERNAME:}
      password: ${PROMETHEUS_SCRAPE_PASSWORD:}
    metrics:
      export:
        enabled: true
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSED:health,info,prometheus}
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      show-components: never
      probes:
        enabled: ${HEALTH_PROBES_ENABLED:true}
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db

info:
  app:
    name: Hamro Chalchitraghar
    description: Movie ticket booking backend
    version: ${APP_VERSION:local}

app:
  time-zone: ${APP_TIME_ZONE:Asia/Kathmandu}
  refunds:
    reports:
      max-range-days: ${REFUND_REPORTS_MAX_RANGE_DAYS:366}
      default-bucket: ${REFUND_REPORTS_DEFAULT_BUCKET:DAY}
    consistency:
      enabled: ${REFUND_CONSISTENCY_ENABLED:true}
      batch-size: ${REFUND_CONSISTENCY_BATCH_SIZE:100}
    retention:
      enabled: ${REFUND_RETENTION_ENABLED:false}
      mode: ${REFUND_RETENTION_MODE:ANONYMIZE}
      refund-days: ${REFUND_RETENTION_REFUND_DAYS:2555}
      attempt-days: ${REFUND_RETENTION_ATTEMPT_DAYS:2555}
      batch-size: ${REFUND_RETENTION_BATCH_SIZE:100}
      interval: ${REFUND_RETENTION_INTERVAL:PT24H}
    processing:
      enabled: ${REFUND_PROCESSING_ENABLED:true}
      auto-process-enabled: ${REFUND_AUTO_PROCESS_ENABLED:false}
      default-method: ${REFUND_DEFAULT_METHOD:MANUAL}
      max-attempts: ${REFUND_MAX_ATTEMPTS:3}
      initial-retry-delay: ${REFUND_INITIAL_RETRY_DELAY:PT1M}
      retry-multiplier: ${REFUND_RETRY_MULTIPLIER:2.0}
      max-retry-delay: ${REFUND_MAX_RETRY_DELAY:PT1H}
      retry-batch-size: ${REFUND_RETRY_BATCH_SIZE:50}
      retry-interval: ${REFUND_RETRY_INTERVAL:PT1M}
      processing-timeout: ${REFUND_PROCESSING_TIMEOUT:PT5M}
      claim-batch-size: ${REFUND_CLAIM_BATCH_SIZE:50}
      worker-id: ${REFUND_WORKER_ID:refund-worker}
  audit:
    export:
      enabled: ${AUDIT_EXPORT_ENABLED:true}
      max-rows: ${AUDIT_EXPORT_MAX_ROWS:10000}
      max-range-days: ${AUDIT_EXPORT_MAX_RANGE_DAYS:31}
    retention:
      enabled: ${AUDIT_RETENTION_ENABLED:false}
      mode: ${AUDIT_RETENTION_MODE:ANONYMIZE}
      default-days: ${AUDIT_RETENTION_DEFAULT_DAYS:365}
      security-days: ${AUDIT_RETENTION_SECURITY_DAYS:730}
      payment-days: ${AUDIT_RETENTION_PAYMENT_DAYS:730}
      high-severity-days: ${AUDIT_RETENTION_HIGH_SEVERITY_DAYS:730}
      batch-size: ${AUDIT_RETENTION_BATCH_SIZE:100}
      interval: ${AUDIT_RETENTION_INTERVAL:PT24H}
    reports:
      max-range-days: ${AUDIT_REPORTS_MAX_RANGE_DAYS:31}
      default-bucket: ${AUDIT_REPORTS_DEFAULT_BUCKET:DAY}
    integrity:
      enabled: ${AUDIT_INTEGRITY_ENABLED:true}
      batch-size: ${AUDIT_INTEGRITY_BATCH_SIZE:500}
      interval: ${AUDIT_INTEGRITY_INTERVAL:PT24H}
    request-context:
      enabled: ${AUDIT_REQUEST_CONTEXT_ENABLED:true}
      request-id-header: ${AUDIT_REQUEST_ID_HEADER:X-Request-ID}
      correlation-id-header: ${AUDIT_CORRELATION_ID_HEADER:X-Correlation-ID}
      capture-ip: ${AUDIT_CAPTURE_IP:false}
      mask-ip: ${AUDIT_MASK_IP:true}
      capture-user-agent: ${AUDIT_CAPTURE_USER_AGENT:true}
      trust-forwarded-headers: ${AUDIT_TRUST_FORWARDED_HEADERS:false}
      max-request-id-length: 100
      max-correlation-id-length: 100
      max-user-agent-length: 512
  notifications:
    reminders:
      enabled: ${NOTIFICATION_REMINDERS_ENABLED:false}
      show-before: ${NOTIFICATION_SHOW_REMINDER_BEFORE:PT2H}
      scan-interval: ${NOTIFICATION_REMINDER_SCAN_INTERVAL:PT5M}
      batch-size: ${NOTIFICATION_REMINDER_BATCH_SIZE:100}
    retention:
      enabled: ${NOTIFICATION_RETENTION_ENABLED:false}
      notification-days: ${NOTIFICATION_RETENTION_DAYS:365}
      delivery-days: ${NOTIFICATION_DELIVERY_RETENTION_DAYS:180}
      batch-size: ${NOTIFICATION_RETENTION_BATCH_SIZE:100}
      interval: ${NOTIFICATION_RETENTION_INTERVAL:PT24H}
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
      from: ${NOTIFICATION_EMAIL_FROM:}
      from-name: ${NOTIFICATION_EMAIL_FROM_NAME:Hamro Chalchitraghar}
      max-attempts: ${NOTIFICATION_EMAIL_MAX_ATTEMPTS:3}
      initial-retry-delay-ms: ${NOTIFICATION_EMAIL_INITIAL_RETRY_DELAY_MS:60000}
      retry-multiplier: ${NOTIFICATION_EMAIL_RETRY_MULTIPLIER:2.0}
      max-retry-delay-ms: ${NOTIFICATION_EMAIL_MAX_RETRY_DELAY_MS:3600000}
      retry-batch-size: ${NOTIFICATION_EMAIL_RETRY_BATCH_SIZE:50}
      retry-interval-ms: ${NOTIFICATION_EMAIL_RETRY_INTERVAL_MS:60000}
      processing-timeout-ms: ${NOTIFICATION_EMAIL_PROCESSING_TIMEOUT_MS:300000}
      async:
        enabled: ${NOTIFICATION_EMAIL_ASYNC_ENABLED:true}
      executor:
        core-pool-size: ${NOTIFICATION_EMAIL_CORE_POOL_SIZE:2}
        max-pool-size: ${NOTIFICATION_EMAIL_MAX_POOL_SIZE:4}
        queue-capacity: ${NOTIFICATION_EMAIL_QUEUE_CAPACITY:100}
        keep-alive-seconds: ${NOTIFICATION_EMAIL_KEEP_ALIVE_SECONDS:60}
  bookings:
    initiated-expiration-minutes: ${BOOKING_INITIATED_EXPIRATION_MINUTES:15}
    currency: ${BOOKING_CURRENCY:NPR}
    expiry-cleanup-interval-ms: ${BOOKING_EXPIRY_CLEANUP_INTERVAL_MS:60000}
    expiry-batch-size: ${BOOKING_EXPIRY_BATCH_SIZE:100}
    cancellation-cutoff-minutes: ${BOOKING_CANCELLATION_CUTOFF_MINUTES:0}
  payments:
    attempt-expiration-minutes: ${PAYMENT_ATTEMPT_EXPIRATION_MINUTES:10}
    local-enabled: ${PAYMENT_LOCAL_ENABLED:false}
    reconciliation-interval-ms: ${PAYMENT_RECONCILIATION_INTERVAL_MS:300000}
    reconciliation-batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:100}
    expiry-interval-ms: ${PAYMENT_EXPIRY_INTERVAL_MS:60000}
    esewa:
      enabled: ${ESEWA_ENABLED:false}
      environment: ${ESEWA_ENVIRONMENT:SANDBOX}
      product-code: ${ESEWA_PRODUCT_CODE:EPAYTEST}
      secret-key: ${ESEWA_SECRET_KEY:disabled-placeholder}
      payment-url: ${ESEWA_PAYMENT_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
      status-check-url: ${ESEWA_STATUS_CHECK_URL:https://rc.esewa.com.np/api/epay/transaction/status/}
      success-url: ${ESEWA_SUCCESS_URL:http://localhost:4200/payment/esewa/success}
      failure-url: ${ESEWA_FAILURE_URL:http://localhost:4200/payment/esewa/failure}
      connect-timeout-ms: ${ESEWA_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${ESEWA_READ_TIMEOUT_MS:10000}
  shows:
    buffer-minutes: ${SHOW_BUFFER_MINUTES:15}
    duration-tolerance-minutes: ${SHOW_DURATION_TOLERANCE_MINUTES:5}
    status-reconciliation-interval-ms: ${SHOW_STATUS_RECONCILIATION_INTERVAL_MS:60000}
  tickets:
    qr:
      encryption-key: ${TICKET_QR_ENCRYPTION_KEY}
      key-id: ${TICKET_QR_KEY_ID:qr-key-v1}
      token-version: ${TICKET_QR_TOKEN_VERSION:1}
      image-size: ${TICKET_QR_IMAGE_SIZE:400}
      image-margin: ${TICKET_QR_IMAGE_MARGIN:2}
    entry-window-minutes: ${TICKET_ENTRY_WINDOW_MINUTES:60}
    post-show-grace-minutes: ${TICKET_POST_SHOW_GRACE_MINUTES:30}
    expiry-reconciliation-interval-ms: ${TICKET_EXPIRY_RECONCILIATION_INTERVAL_MS:60000}
    expiry-batch-size: ${TICKET_EXPIRY_BATCH_SIZE:100}
    pdf-enabled: ${TICKET_PDF_ENABLED:true}
    email:
      enabled: ${TICKET_EMAIL_ENABLED:false}
      from: ${TICKET_EMAIL_FROM:}
      max-attempts: ${TICKET_EMAIL_MAX_ATTEMPTS:3}
      retry-interval-ms: ${TICKET_EMAIL_RETRY_INTERVAL_MS:60000}
      retry-batch-size: ${TICKET_EMAIL_RETRY_BATCH_SIZE:50}
