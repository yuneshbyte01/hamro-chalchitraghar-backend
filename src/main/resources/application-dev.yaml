spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  mail:
    from: ${MAIL_FROM}
    enabled: ${MAIL_ENABLED}
  password-reset:
    otp-expiration-minutes: ${PASSWORD_RESET_OTP_EXPIRATION_MINUTES}
    max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
