global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: hamro-chalchitraghar
    metrics_path: /actuator/prometheus
    scheme: http
    basic_auth:
      username: prometheus
      password_file: /run/secrets/prometheus_scrape_password
    static_configs:
      - targets: [app:8080]
        labels:
          deployment: compose
